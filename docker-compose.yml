# =============================================================================
# Hermes Agent + Ollama — Engineering Drawing Review Platform
# MEP (HVAC, Plumbing, Firefighting, Medical Gas) workflow scaffolding
# =============================================================================

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mep-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for NVIDIA GPU inference (needs nvidia-docker2)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-mep-review
    restart: unless-stopped
    ports:
      - "6789:6789"
    environment:
      # --- Cloud LLM providers (optional if using Ollama) ---
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Ollama (local / self-hosted inference) ---
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:120b-cloud}
      # --- Hermes config ---
      HERMES_PROFILE: ${HERMES_PROFILE:-default}
      HERMES_HOME: /root/.hermes
      HERMES_WORKDIR: /workspace
    volumes:
      - hermes_data:/root/.hermes
      - ./workspace:/workspace
      - ./skills:/root/.hermes/skills:ro
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webhook:
    build: ./webhook-bridge
    container_name: mep-webhook
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WORKSPACE: /workspace
    volumes:
      - ./workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  hermes_data:
    driver: local
  ollama_data:
    driver: local
